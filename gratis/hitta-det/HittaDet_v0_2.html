<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitta det! v0.2</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f5f5f5;}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.1);}
h1{font-size:48px;text-align:center;}
h2{font-size:32px;}
input,textarea,select{width:100%;padding:10px;margin:5px 0 15px;box-sizing:border-box;}
button{width:100%;padding:12px;margin-bottom:10px;}
.card{background:#fafafa;border:1px solid #ddd;padding:15px;border-radius:8px;margin-bottom:10px;}
.card strong{font-size:24px;}
.actions{display:flex;gap:10px;}
</style>
</head>
<body>
<div class="container">
<h1>🔎 Hitta det!</h1>
<input type="text" id="search" placeholder="Vad söker du?">
<h2>Ny post</h2>
<select id="kategori"><option>Garanti</option><option>Försäkring</option><option>Lösenord</option><option>Dokument</option><option>Övrigt</option></select>
<input id="namn" placeholder="Namn">
<textarea id="info" placeholder="Information"></textarea>
<input id="plats" placeholder="Plats">
<input type="date" id="datum">
<button id="saveBtn">Spara post</button>
<hr>
<button id="toggleBtn">▼ Visa sparade poster</button>
<div id="resultat" style="display:none"></div>
</div>
</body>
</html>
