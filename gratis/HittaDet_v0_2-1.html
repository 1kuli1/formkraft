<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitta det! – Prototyp 0.1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f1ea;
      color: #222;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }
    header {
      background: #1f2f3d;
      color: white;
      padding: 28px 18px;
      border-radius: 0 0 22px 22px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 3rem;
      font-weight: bold;
    }
    header p {
      margin: 0;
      opacity: 0.9;
    }
    .panel {
      background: white;
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }
    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #e7b44c;
      color: #1b1b1b;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button.secondary {
      background: #e8e8e8;
    }
    button.danger {
      background: #c94f4f;
      color: white;
    }
    .searchbox {
      font-size: 1.15rem;
      padding: 16px;
      border: 2px solid #e7b44c;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .card {
      border: 1px solid #ddd;
      border-left: 6px solid #e7b44c;
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      background: #fbfbfb;
    }
    .card h3 {
      margin: 0 0 8px;
    }
    .muted {
      color: #666;
      font-size: 0.95rem;
    }
    .small {
      font-size: 0.9rem;
    }
    h2 { font-size: 2rem; font-weight: bold; }
    .empty {
      padding: 18px;
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 14px;
      text-align: center;
      color: #555;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      header h1 { font-size: 1.7rem; }
      .wrap { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔎 Hitta det!</h1>
    <p>Garantier, försäkringar, lösenordstips, dokument och pärmar – på ett ställe.</p>
  </header>

  <main class="wrap">
    <section class="panel">
      <label for="search">Vad söker du?</label>
      <input class="searchbox" type="text" id="search" placeholder="Exempel: hemförsäkring, gräsklippare, Netflix, pärm 3">
      <p class="muted small">Allt sparas bara lokalt i denna webbläsare. Ingen inloggning och inget moln.</p>
    </section>

    <section class="panel">
      <h2>Ny post</h2>

      <div class="grid">
        <div>
          <label for="kategori">Kategori</label>
          <select id="kategori">
            <option>Garanti</option>
            <option>Försäkring</option>
            <option>Lösenord</option>
            <option>Dokument</option>
            <option>Pärm / fysisk plats</option>
            <option>Övrigt</option>
          </select>
        </div>
        <div>
          <label for="datum">Giltig till / går ut</label>
          <input type="date" id="datum">
        </div>
      </div>

      <label for="namn">Namn</label>
      <input type="text" id="namn" placeholder="Exempel: Hemförsäkring, TV-garanti, Netflix">

      <label for="plats">Var finns det?</label>
      <input type="text" id="plats" placeholder="Exempel: Pärm 3 i garderoben, digitalt i datorn, kassaskåp">

      <label for="info">Information / minnesanteckning</label>
      <textarea id="info" placeholder="Skriv sådant som hjälper dig att hitta rätt. Skriv inte hela lösenord här om du vill vara extra säker."></textarea>

      <button id="sparaKnapp" onclick="sparaPost()">Spara post</button>
      <button class="secondary" onclick="rensaFormular()">Rensa fält</button>
    </section>

    <section class="panel">
      <h2>Resultat</h2>
      <button id="toggleBtn" class="secondary" onclick="visaDoljPoster()">▼ Visa sparade poster</button>
      <div id="resultat" style="display:none;"></div>
    </section>
  </main>

  <script>
    const storageKey = "hittadet_poster_v01";
    let poster = JSON.parse(localStorage.getItem(storageKey)) || [];
    let redigeraIndex = -1;
    let posterSynliga = false;

    function sparaTillWebblasare() {
      localStorage.setItem(storageKey, JSON.stringify(poster));
    }

    function hamtaText(id) {
      return document.getElementById(id).value.trim();
    }

    function rensaFormular() {
      document.getElementById("namn").value = "";
      document.getElementById("plats").value = "";
      document.getElementById("info").value = "";
      document.getElementById("datum").value = "";
      document.getElementById("kategori").selectedIndex = 0;
    }

    function redigeraPost(index){
      const post = poster[index];
      document.getElementById("kategori").value = post.kategori;
      document.getElementById("namn").value = post.namn;
      document.getElementById("plats").value = post.plats;
      document.getElementById("info").value = post.info;
      document.getElementById("datum").value = post.datum;
      redigeraIndex = index;
      document.getElementById("sparaKnapp").textContent = "Uppdatera post";
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function visaDoljPoster(){
      const resultat = document.getElementById("resultat");
      const knapp = document.getElementById("toggleBtn");
      posterSynliga = !posterSynliga;
      resultat.style.display = posterSynliga ? "block" : "none";
      knapp.textContent = posterSynliga ? "▲ Dölj sparade poster" : "▼ Visa sparade poster";
      if(posterSynliga){ visaPoster(filtreraPoster()); }
    }

    function sparaPost() {
      const post = {
        kategori: hamtaText("kategori"),
        namn: hamtaText("namn"),
        plats: hamtaText("plats"),
        info: hamtaText("info"),
        datum: hamtaText("datum"),
        skapad: new Date().toISOString()
      };

      if (!post.namn) {
        alert("Skriv ett namn på posten först.");
        return;
      }

      if (redigeraIndex >= 0) {
        poster[redigeraIndex] = post;
        redigeraIndex = -1;
        document.getElementById("sparaKnapp").textContent = "Spara post";
      } else {
        poster.unshift(post);
      }
      sparaTillWebblasare();
      rensaFormular();
      visaPoster(filtreraPoster());
    }

    function taBortPost(index) {
      if (!confirm("Vill du ta bort denna post?")) return;
      poster.splice(index, 1);
      sparaTillWebblasare();
      visaPoster(filtreraPoster());
    }

    function dagarKvar(datum) {
      if (!datum) return "";
      const idag = new Date();
      const slutdatum = new Date(datum + "T00:00:00");
      const skillnad = Math.ceil((slutdatum - idag) / (1000 * 60 * 60 * 24));
      if (skillnad < 0) return "Har gått ut";
      if (skillnad === 0) return "Går ut idag";
      return skillnad + " dagar kvar";
    }

    function filtreraPoster() {
      const sokord = document.getElementById("search").value.toLowerCase().trim();
      if (!sokord) return poster;

      return poster.filter(post => {
        const allt = `${post.kategori} ${post.namn} ${post.plats} ${post.info} ${post.datum}`.toLowerCase();
        return allt.includes(sokord);
      });
    }

    function visaPoster(lista) {
      const resultat = document.getElementById("resultat");
      resultat.innerHTML = "";

      if (lista.length === 0) {
        resultat.innerHTML = '<div class="empty">Inga poster hittades ännu.</div>';
        return;
      }

      lista.forEach(post => {
        const verkligtIndex = poster.indexOf(post);
        const datumText = post.datum ? `${post.datum} (${dagarKvar(post.datum)})` : "Ej angivet";

        resultat.innerHTML += `
          <article class="card">
            <h3>${skydda(post.namn)}</h3>
            <p><strong>Kategori:</strong> ${skydda(post.kategori)}</p>
            <p><strong>Var finns det?</strong> ${skydda(post.plats || "Ej angivet")}</p>
            <p><strong>Giltig till / går ut:</strong> ${skydda(datumText)}</p>
            <p><strong>Information:</strong><br>${skydda(post.info || "Ingen information")}</p>
            <button class="secondary" onclick="redigeraPost(${verkligtIndex})">Redigera</button><button class="danger" onclick="taBortPost(${verkligtIndex})">Ta bort</button>
          </article>
        `;
      });
    }

    function skydda(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("search").addEventListener("input", () => {
      if(!posterSynliga){ visaDoljPoster(); }
      visaPoster(filtreraPoster());
    });


  </script>
</body>
</html>
